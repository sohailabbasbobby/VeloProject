version: '3.8'

services:
  # ---------------------------------------------------------
  # VELO POSTGRESQL + POSTGIS (SPATIAL DATABASE)
  # ---------------------------------------------------------
  db:
    image: postgis/postgis:15-3.3
    container_name: velo_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-velo_network}
      POSTGRES_USER: ${DB_USER:-velo_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in production}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-velo_admin} -d ${DB_NAME:-velo_network}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # Persistent volume mapping to protect financial and geospatial records
      - velo_db_data:/var/lib/postgresql/data
      # Schema initializer applied on first boot (§7.6)
      - ./backend-core/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - velo_secure_net

  # ---------------------------------------------------------
  # VELO BACKEND CORE API
  # ---------------------------------------------------------
  backend-core:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: velo_backend_prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=postgres://${DB_USER:-velo_admin}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DB_NAME:-velo_network}
      - DB_POOL_MAX=${DB_POOL_MAX:-20}
      # Third-party credentials (§7.5) — all required for full functionality
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PROXY_SERVICE_SID=${TWILIO_PROXY_SERVICE_SID}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      # Self-hosted auth (Jawa Ride pattern) — no Firebase Auth/Firestore
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET (min 32 chars) is required in production}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ADMIN_KEY=${ADMIN_KEY:?ADMIN_KEY is required in production}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - velo_secure_net

  # ---------------------------------------------------------
  # TENANT BACK-OFFICE ERP (desktop-only)
  # ---------------------------------------------------------
  tenant-erp:
    build:
      context: ./tenant-dashboard-erp
      dockerfile: Dockerfile
    container_name: velod_erp_prod
    restart: always
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE=http://backend-core:8000
    depends_on:
      - backend-core
    networks:
      - velo_secure_net

  # ---------------------------------------------------------
  # PLATFORM-OWNER BACKOFFICE (desktop-only)
  # ---------------------------------------------------------
  backoffice:
    build:
      context: ./backoffice-dashboard
      dockerfile: Dockerfile
    container_name: velo_backoffice_prod
    restart: always
    ports:
      - "5174:80"
    environment:
      - VITE_API_BASE=http://backend-core:8000
    depends_on:
      - backend-core
    networks:
      - velo_secure_net

networks:
  velo_secure_net:
    driver: bridge

volumes:
  velo_db_data:
